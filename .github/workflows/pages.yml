name: Manual Frontend Deploy

on:
  push:
    branches: ["main"]      # Keeps automatic deployment on push
  workflow_dispatch:        # <--- THIS adds the "Run Workflow" button in GitHub
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        [cite_start]uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          [cite_start]cache: 'npm'

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          [cite_start]path: ./dist # Use 'build' for CRA or 'dist' for Vite [cite: 38, 39, 111]

  deploy:
    [cite_start]needs: build [cite: 113]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      [cite_start]url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        [cite_start]uses: actions/deploy-pages@v4 
